<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petar puni 18</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
span{
    font-size: 42px;
  font-weight: 900;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

body {
    margin: 0;
  font-family: 'Poppins', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
  
  /* Gradient overlay + background image */
  background: 
    radial-gradient(circle at top, rgba(0,0,0,0.6), rgba(0,0,0,0.9) 70%), 
    url('background.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
}

.card {
  background: rgba(15,15,15,0.95);
  padding: 45px;
  border-radius: 25px;
  max-width: 550px;
  width: 92%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,215,0,0.25);
  border: 1px solid rgba(255,215,0,0.2);
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(90deg, gold, orange);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.info {
  background: #1c1c1c;
  padding: 18px;
  border-radius: 15px;
  margin: 25px 0;
}

.info a {
  color: gold;
  text-decoration: none;
  font-weight: bold;
}

.countdown-box {
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
  background: #111;
  box-shadow: 0 0 25px rgba(255,215,0,0.15);
}

.countdown-title {
  font-weight: 700;
  color: gold;
}

.countdown {
  font-size: 18px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  border: none;
  border-radius: 18px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.dolazim {
  background: linear-gradient(90deg, #16a34a, #22c55e);
}

.ne-dolazim {
  background: linear-gradient(90deg, #dc2626, #ef4444);
}

button:hover {
  transform: scale(1.05);
}

button:disabled {
  background: gray;
  cursor: not-allowed;
  transform: none;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  border: none;
}

.footer {
  margin-top: 18px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>
<body>

<!-- Muzika -->
<audio id="bgMusic" loop autoplay muted>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Petar puni 18 <span 🎉</span></h1>
  <p>Spremi se za veče koje se pamti!</p>

  <button class="music-btn" onclick="toggleMusic()">🔊 Muzika ON/OFF</button>

  <div class="info">
    <p><strong>Datum:</strong> 5. april</p>
    <p><strong>Lokacija:</strong> 
      <a href="https://www.google.com/maps/search/?api=1&query=Restoran+Kod+Kovaca" target="_blank">
        Restoran "Kod Kovača"
      </a>
    </p>
    <p><strong>Potvrda dolaska do:</strong> 15. mart</p>
  </div>

  <div class="countdown-box">
    <div class="countdown-title">Odbrojavanje do rođendana 🎂</div>
    <div id="birthdayCountdown" class="countdown"></div>
  </div>

  <div class="countdown-box">
    <div class="countdown-title">Rok za potvrdu dolaska ⏳</div>
    <div id="rsvpCountdown" class="countdown"></div>
  </div>

  <form id="rsvpForm" action="https://formsubmit.co/pepimilenkorodjendan@gmail.com" method="POST">
    <input type="text" name="Ime" placeholder="Unesi svoje ime" required>

    <button class="dolazim" type="submit" name="Odgovor" value="Dolazim 🎉">Dolazim 🎉</button>
    <button class="ne-dolazim" type="submit" name="Odgovor" value="Ne dolazim 😢">Ne dolazim 😢</button>
  </form>

  <div class="footer">Biće muzika, slavlje i dobra energija 🔥</div>
</div>

<script>
    
    document.body.addEventListener('click', function firstClick() {
  const music = document.getElementById('bgMusic');
  music.muted = false;      // unmute
  music.play();             // start playing if paused
  document.body.removeEventListener('click', firstClick);
});
// Confetti on load
  function toggleMusic() {
  const music = document.getElementById("bgMusic");
  music.paused ? music.play() : music.pause();
}
window.onload = function() {
  confetti({
    particleCount: 150,
    spread: 100,
    origin: { y: 0.6 }
  });
};

function countdown(targetDate, elementId, disableAfter=false) {
  const countDownDate = new Date(targetDate).getTime();

  const interval = setInterval(function() {
    const now = new Date().getTime();
    const distance = countDownDate - now;

    if (distance < 0) {
      document.getElementById(elementId).innerHTML = "Vreme je isteklo!";
      clearInterval(interval);

      if(disableAfter) {
        document.querySelectorAll("button").forEach(btn => btn.disabled = true);
        document.querySelector("input").disabled = true;
      }
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById(elementId).innerHTML =
      days + "d " + hours + "h " + minutes + "m " + seconds + "s";
  }, 1000);
}

const currentYear = new Date().getFullYear();
countdown(`April 5, ${currentYear} 19:00:00`, "birthdayCountdown");
countdown(`March 15, ${currentYear} 23:59:59`, "rsvpCountdown", true);
</script>

</body>
</html>
