<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petar puni 18</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000000 70%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
}

.card {
  background: rgba(15,15,15,0.95);
  padding: 45px;
  border-radius: 25px;
  max-width: 550px;
  width: 92%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,215,0,0.25);
  border: 1px solid rgba(255,215,0,0.2);
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(90deg, gold, orange);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

.info {
  background: #1c1c1c;
  padding: 18px;
  border-radius: 15px;
  margin: 25px 0;
  font-size: 15px;
}

.countdown-box {
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
  background: #111;
  box-shadow: 0 0 25px rgba(255,215,0,0.15);
}

.countdown-title {
  font-weight: 700;
  margin-bottom: 8px;
  color: gold;
}

.countdown {
  font-size: 18px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  border: none;
  border-radius: 18px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.dolazim {
  background: linear-gradient(90deg, #16a34a, #22c55e);
  color: white;
}
.dolazim:hover {
  transform: scale(1.05);
}

.ne-dolazim {
  background: linear-gradient(90deg, #dc2626, #ef4444);
  color: white;
}
.ne-dolazim:hover {
  transform: scale(1.05);
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
}

.footer {
  margin-top: 18px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>
<body>

<div class="card">
  <h1>Petar puni 18 🎉</h1>
  <p>Spremi se za veče koje se pamti!</p>

  <div class="info">
    <p><strong>Datum:</strong> 5. april</p>
    <p><strong>Lokacija:</strong> Restoran "Kod Kovača"</p>
    <p><strong>Potvrda dolaska do:</strong> 15. mart</p>
  </div>

  <div class="countdown-box">
    <div class="countdown-title">Odbrojavanje do rođendana 🎂</div>
    <div id="birthdayCountdown" class="countdown"></div>
  </div>

  <div class="countdown-box">
    <div class="countdown-title">Rok za potvrdu dolaska ⏳</div>
    <div id="rsvpCountdown" class="countdown"></div>
  </div>

  <form action="https://formsubmit.co/lazarstojanovic753@gmail.com" method="POST">
    <input type="text" name="Ime" placeholder="Unesi svoje ime" required>

    <button class="dolazim" type="submit" name="Odgovor" value="Dolazim 🎉">
      Dolazim 🎉
    </button>

    <button class="ne-dolazim" type="submit" name="Odgovor" value="Ne dolazim 😢">
      Ne dolazim 😢
    </button>
  </form>

  <div class="footer">
    Biće muzika, slavlje i dobra energija 🔥
  </div>
</div>

<script>
function countdown(targetDate, elementId) {
  const countDownDate = new Date(targetDate).getTime();

  setInterval(function() {
    const now = new Date().getTime();
    const distance = countDownDate - now;

    if (distance < 0) {
      document.getElementById(elementId).innerHTML = "Vreme je isteklo!";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById(elementId).innerHTML =
      days + "d " + hours + "h " + minutes + "m " + seconds + "s";
  }, 1000);
}

// Podesi godinu automatski
const currentYear = new Date().getFullYear();
countdown(`April 5, ${currentYear} 19:00:00`, "birthdayCountdown");
countdown(`March 15, ${currentYear} 23:59:59`, "rsvpCountdown");
</script>

</body>
</html>
